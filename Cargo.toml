[package]
name = "thocoin"
version = "1.0.2"
edition = "2021"

[dependencies]
sha2 = "0.10"
ripemd = "0.1"
bs58 = "0.5"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"], default-features = false }
bincode = "1.3"
sled = "0.34"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
eframe = "0.27"
egui = "0.27"
parking_lot = "0.12"
anyhow = "1"
thiserror = "1"
jsonrpc-core = "18"
jsonrpc-http-server = "18"
qrcode = "0.14"
image = { version = "0.25", default-features = false, features = ["png"] }
bip39 = { version = "2", features = ["rand"] }
ocl = { version = "0.19", optional = true }
totp-rs = "5"
base32 = "0.5"
fips204 = "0.4"
argon2 = "0.5"
chacha20poly1305 = "0.10"
zeroize = { version = "1", features = ["derive"] }
rpassword = "7"
subtle = "2"

[features]
gpu = ["dep:ocl"]

[build-dependencies]
winres = "0.1"

# thocoind: the always-on node (run on the 24/7 machine as the network seed).
[[bin]]
name = "thocoind"
path = "src/main.rs"

# thocoin-gui: the mining app users download. Contains BOTH mining modes
# (solo + pool) in one process on one shared chain. No separate pool binary.
[[bin]]
name = "thocoin-gui"
path = "src/gui_main.rs"
